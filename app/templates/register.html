<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - حضور</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; }
    h1 { text-align: center; margin-bottom: 8px; font-size: 24px; }
    p.sub { text-align: center; color: #888; margin-bottom: 32px; font-size: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
    input { width: 100%; padding: 12px 16px; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 15px; margin-bottom: 20px; outline: none; }
    input:focus { border-color: #6c63ff; }
    button { width: 100%; padding: 13px; background: #6c63ff; border: none; border-radius: 10px; color: #fff; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #5a52d5; }
    .error { color: #ff6b6b; font-size: 13px; margin-bottom: 16px; display: none; }
    .footer { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
    .footer a { color: #6c63ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 حضور</h1>
    <p class="sub">أنشئ حسابك وابدأ إدارة مناسباتك</p>
    <div class="error" id="error-msg"></div>
    <label>الاسم</label>
    <input type="text" id="name" placeholder="محمد أحمد">
    <label>الإيميل</label>
    <input type="email" id="email" placeholder="example@email.com">
    <label>كلمة السر</label>
    <input type="password" id="password" placeholder="••••••••">
    <button onclick="register()">إنشاء حساب</button>
    <div class="footer">عندك حساب؟ <a href="/login">سجّل دخولك</a></div>
  </div>
  <script>
    async function register() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');
      errorEl.style.display = 'none';
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('access_token', data.access_token);
        window.location.href = '/packages';
      } else {
        errorEl.textContent = data.detail || 'حدث خطأ';
        errorEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
